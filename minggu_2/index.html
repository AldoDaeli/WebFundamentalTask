<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – belajartailwind.com</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center" style="font-family:'Inter',sans-serif;">
  <div class="bg-white rounded-xl shadow-md w-full max-w-sm p-8">
    <div class="mb-6 text-center">
      <h1 class="text-xl font-bold text-blue-800">tokopediaKW.com</h1>
    </div>
    <div class="flex flex-col gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" placeholder="Masukkan username" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" placeholder="Masukkan password" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <a href="dashboard.html" class="bg-blue-800 hover:bg-blue-700 text-white text-sm font-semibold text-center py-2 rounded-lg transition">Login</a>
    </div>
  </div>
</body>
</html>
