<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Product – belajartailwind.com</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col" style="font-family:'Inter',sans-serif;">
  <header class="bg-blue-800 flex items-center justify-between px-6 py-3 shadow">
    <span class="text-white font-bold">tokopediaKW.com</span>
    <a href="index.html" class="text-white text-sm border border-blue-600 px-4 py-1 rounded hover:bg-blue-700 transition">Logout</a>
  </header>
  <div class="flex flex-1">
    <aside class="w-48 bg-white border-r border-gray-200 flex flex-col py-4 shrink-0">
      <nav class="flex flex-col gap-1 px-3">
        <a href="dashboard.html" class="text-gray-600 font-semibold text-sm px-4 py-2 rounded hover:bg-gray-100 transition">Dashboard</a>
        <a href="products.html" class="bg-blue-800 text-white font-semibold text-sm px-4 py-2 rounded">Products</a>
        <a href="users.html" class="text-gray-600 font-semibold text-sm px-4 py-2 rounded hover:bg-gray-100 transition">Users</a>
        <a href="setting.html" class="text-gray-600 font-semibold text-sm px-4 py-2 rounded hover:bg-gray-100 transition">Setting</a>
      </nav>
    </aside>
    <main class="flex-1 p-8 flex flex-col gap-6">
      <div class="flex items-center gap-2">
        <a href="products.html" class="text-blue-800 hover:underline text-sm font-semibold">← Kembali</a>
        <span class="text-gray-400 text-sm">/</span>
        <h1 class="text-2xl font-bold text-gray-800">Add Product</h1>
      </div>
      <div class="bg-white rounded-xl shadow p-6 max-w-lg">
        <div class="flex flex-col gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Produk</label>
            <input type="text" placeholder="Masukkan nama produk" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Stok</label>
            <input type="number" placeholder="Masukkan jumlah stok" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Harga (Rp)</label>
            <input type="number" placeholder="Masukkan harga produk" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
            <textarea rows="3" placeholder="Masukkan deskripsi produk" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
          </div>
          <div class="flex gap-3 pt-2">
            <button class="bg-blue-800 hover:bg-blue-700 text-white text-sm font-semibold px-6 py-2 rounded-lg transition">Simpan</button>
            <a href="products.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-semibold px-6 py-2 rounded-lg transition">Batal</a>
          </div>
        </div>
      </div>
    </main>
  </div>
  <footer class="bg-black px-8 py-3 flex justify-center text-xs text-white">
    <span>© 2026 belajartailwind.com. All rights reserved.</span>
  </footer>
</body>
</html>
