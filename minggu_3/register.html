<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrasi</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-10">

  <div class="bg-white rounded-2xl shadow p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Registrasi Akun</h1>

    <form id="registrasiForm" action="dashboard.html" method="GET" novalidate>
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">Username *</label>
        <input id="username" type="text" placeholder="Minimal 3 karakter"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <p id="err-username" class="text-xs text-red-500 mt-1"></p>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">Password *</label>
        <input id="password" type="password" placeholder="Minimal 8 karakter"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <p id="err-password" class="text-xs text-red-500 mt-1"></p>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">Nama *</label>
        <input id="nama" type="text" placeholder="Nama lengkap"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <p id="err-nama" class="text-xs text-red-500 mt-1"></p>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Lahir *</label>
        <input id="tgl_lahir" type="date"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <p id="err-tgl_lahir" class="text-xs text-red-500 mt-1"></p>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">Alamat *</label>
        <textarea id="alamat" rows="2" placeholder="Alamat lengkap"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none"></textarea>
        <p id="err-alamat" class="text-xs text-red-500 mt-1"></p>
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-1">Nomor Telepon *</label>
        <input id="no_telpon" type="tel" placeholder="628xxxxxxxxx"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <p id="err-no_telpon" class="text-xs text-red-500 mt-1"></p>
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
        Daftar
      </button>

    </form>
  </div>

  <script src="validasi_input.js"></script>
</body>
</html>
