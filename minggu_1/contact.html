<main class="wrap">

  <p class="section-label">🌐︎ Kontak</p>
  <h1 class="section-title" style="font-size:26px;">Mari Berkolaborasi</h1>
  <p style="color:var(--muted);font-size:14px;margin-bottom:32px;">Kirim pesan untuk diskusi atau kolaborasi.</p>

  <div class="contact-wrap">

    <form class="cform" action="#" method="POST">
      <div class="frow">
        <div class="fg">
          <label for="nama">ⓘ Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="me !!" required />
        </div>
        <div class="fg">
          <label for="email">☏ Email</label>
          <input type="email" id="email" name="email" placeholder="me@email.com" required />
        </div>
      </div>
      <div class="fg">
        <label for="kategori">⫶☰ Keperluan</label>
        <select id="kategori" name="kategori" required>
          <option value="" disabled selected>Pilih...</option>
          <option value="konsultasi">Konsultasi</option>
          <option value="kolaborasi">Kolaborasi Proyek</option>
          <option value="pertanyaan">Pertanyaan Umum</option>
        </select>
      </div>
      <div class="fg">
        <label for="pesan">🖂 Pesan</label>
        <textarea id="pesan" name="pesan" rows="5" placeholder="Tuliskan pesanmu..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:fit-content;">⌯⌲ Kirim Pesan</button>
    </form>

      <div class="ccard">
